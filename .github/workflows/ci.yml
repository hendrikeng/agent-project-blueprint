name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - 24.13.1
          - 24.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Root Harness Tests
        run: npm run test:root

      - name: Template Consumer Smoke
        run: npm run test:template-smoke

      - name: Golden Adoption Workflow
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: npm run test:golden-adopted-repo
