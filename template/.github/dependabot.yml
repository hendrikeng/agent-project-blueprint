# Weekly dependency updates. Minor and patch updates share one pull request per ecosystem.
# Each major update gets its own pull request, so you can read its changelog first.
# cooldown matches the pnpm minimumReleaseAge of 1440 minutes: a new release waits one day. Security updates do not wait.
# Updates enter the dev integration branch, like slice and fix pull requests.
version: 2
updates:
  # npm also covers pnpm and Yarn. For a Bun project, change npm to bun.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  # The workflows and the composite setup action pin actions to commit SHAs. Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  # For a Python project, add an entry for uv (uv.lock) or pip (requirements.txt), with the same settings:
  # - package-ecosystem: uv
  #   directory: /
  #   target-branch: dev
  #   schedule:
  #     interval: weekly
  #   cooldown:
  #     default-days: 1
