name: ci-cache

# Seeds the node_modules cache on the integration branches. Pull requests can restore caches
# from their base branch only, so this run gives more than 95% of pull request runs a cache hit.
# It installs dependencies and runs no checks.
on:
  push:
    branches: [dev, main]
    paths:
      - package.json
      - "{{PACKAGE_MANAGER_LOCKFILE}}"
      - .github/actions/setup/**
      - .github/workflows/ci-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: Seed node_modules cache
    runs-on: ubicloud-standard-2
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: "{{NODE_VERSION}}"
          install-command: "{{CI_INSTALL_COMMAND}}"
          package-manager: "{{PACKAGE_MANAGER_CACHE}}"
          lockfile: "{{PACKAGE_MANAGER_LOCKFILE}}"
