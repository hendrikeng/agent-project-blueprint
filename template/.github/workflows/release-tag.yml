name: release-tag

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-publication-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  tag-release:
    name: Publish Release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate release identity
        id: release
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          release_branch="$RELEASE_BRANCH"
          release_title="$RELEASE_TITLE"

          if [[ ! "$release_branch" =~ ^release/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Release branch must match release/YYYY.MM.DD.N, got: $release_branch" >&2
            exit 1
          fi

          release_version="${release_branch#release/}"
          IFS='.' read -r release_year release_month release_day release_sequence <<< "$release_version"
          parsed_date="$(date -d "$release_year-$release_month-$release_day" +%Y.%m.%d 2>/dev/null || true)"
          if [[ "$parsed_date" != "$release_year.$release_month.$release_day" || ! "$release_sequence" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release version must contain a real calendar date and positive sequence, got: $release_version" >&2
            exit 1
          fi

          expected_title="Release $release_version"

          if [[ "$release_title" != "$expected_title" ]]; then
            echo "Release PR title must be '$expected_title', got: $release_title" >&2
            exit 1
          fi

          {
            echo "version=$release_version"
            echo "tag=v$release_version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA"
          release_tags() {
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]{2})\.([1-9][0-9]*)$ ]] || continue
              day="${BASH_REMATCH[1]}"
              [[ "$(date -u -d "${day//./-}" +%Y.%m.%d 2>/dev/null)" == "$day" ]] || continue
              printf '%s\n' "$tag"
            done < <(git tag "$@")
          }
          base_sha="$MERGE_SHA"
          found_current_pr=false
          while [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$base_sha/pulls" --jq "any(.number == $RELEASE_PR_NUMBER)")" == true ]]; do
            found_current_pr=true
            base_sha="$(git rev-parse "$base_sha^1")"
          done
          if [[ "$found_current_pr" != true ]]; then
            echo "Cannot derive the landed release boundary for PR #$RELEASE_PR_NUMBER" >&2
            exit 1
          fi
          BASE_SHA="$base_sha"
          base="$(release_tags --points-at "$BASE_SHA" --list | sort -V | tail -n 1)"
          if [[ -z "$base" ]]; then
            tags="$(release_tags --list)"
            if [[ -n "$tags" ]] && grep -qvxF "$RELEASE_TAG" <<< "$tags"; then
              echo "No release tag points to the release PR base: $BASE_SHA" >&2
              exit 1
            fi
            previous_release_pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA/pulls" --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))] | first | .number // empty')"
            if [[ -n "$previous_release_pr" ]]; then
              echo "The release PR at the current PR base has not been published: #$previous_release_pr" >&2
              exit 1
            fi
            base="$BASE_SHA"
          elif [[ "$(gh release view "$base" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" != false ]]; then
            echo "The release at the PR base is not published: $base" >&2
            exit 1
          fi
          node scripts/automation/release-notes.mjs --base "$base" --head "$SOURCE_SHA" > "$RUNNER_TEMP/release-notes.md"
          printf '\nRelease PR: %s\n' "$RELEASE_PR_URL" >> "$RUNNER_TEMP/release-notes.md"

      - name: Create or verify annotated release tags
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          source_tag="source-$tag"
          version="$RELEASE_VERSION"
          merge_sha="$MERGE_SHA"
          source_sha="$SOURCE_SHA"

          git fetch --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for candidate in "$tag" "$source_tag"; do
            expected="$merge_sha"
            if [[ "$candidate" == "$source_tag" ]]; then expected="$source_sha"; fi
            if git show-ref --verify --quiet "refs/tags/$candidate"; then
              if [[ "$(git cat-file -t "refs/tags/$candidate")" != tag || "$(git rev-parse "$candidate^{commit}")" != "$expected" ]]; then
                echo "Tag is not annotated or points to a different commit: $candidate" >&2
                exit 1
              fi
            elif [[ "$candidate" == "$tag" ]]; then
              git tag -a "$tag" "$merge_sha" -m "Release $version" -m "Source-Tag: $source_tag"
            else
              git tag -a "$source_tag" "$source_sha" -m "Release $version source boundary"
            fi
          done
          git push --atomic origin "refs/tags/$tag" "refs/tags/$source_tag"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"; then
            exit 0
          fi
          release_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" || exit 1
          if [[ "$release_state" != false ]]; then
            echo "Existing release is a draft or prerelease: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "Release already exists; preserving its notes: $RELEASE_TAG"
