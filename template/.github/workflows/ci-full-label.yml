name: ci-full-label

# A new push invalidates heavy-tier approval. Add ci:full again when the PR is final.
on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove:
    name: Remove ci:full
    if: contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/ci%3Afull"
