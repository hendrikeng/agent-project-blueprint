name: ci-candidate
run-name: CI candidate ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact dev ancestor to validate (lowercase 40-character commit SHA)
        required: true
        type: string
      full:
        description: Run Full even if a green PR Full run of the exact tree exists
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # scripts/ci/full-reuse.mjs reads the merged PR, its runs, jobs, and artifacts.
  actions: read
  pull-requests: read

concurrency:
  group: ci-candidate-${{ inputs.revision }}
  cancel-in-progress: true

env:
  NODE_VERSION: "{{NODE_VERSION}}"
  CI_INSTALL_COMMAND: "{{CI_INSTALL_COMMAND}}"

jobs:
  candidate:
    name: Candidate Full Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate trusted dispatch
        env:
          REVISION: ${{ inputs.revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Require the exact dev ancestor
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          git fetch origin dev
          test "$(git rev-parse HEAD)" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" origin/dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: ${{ env.CI_INSTALL_COMMAND }}
      - run: npm run eval:refresh && git diff --exit-code -- docs/generated/evals-report.json
      # Run the reuse lookup of the dispatch commit, not of the revision under test. Any doubt runs Full.
      - name: Find a green PR Full run of this exact tree
        id: reuse
        if: ${{ !inputs.full }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/full-reuse"
          for file in full-reuse.mjs classify-change.mjs; do git show "$GITHUB_SHA:scripts/ci/$file" >"$RUNNER_TEMP/full-reuse/$file" || break; done
          timeout 120 node "$RUNNER_TEMP/full-reuse/full-reuse.mjs" || echo 'run_id=' >>"$GITHUB_OUTPUT"
      # Add date-dependent gates, such as a dependency audit, here: a reused Full does not run them again.
      - run: npm run verify:fast
        if: steps.reuse.outputs.run_id == ''
      - run: npm run verify:full -- --skip-fast
        if: steps.reuse.outputs.run_id == ''
      - name: Record successful validation identity
        env:
          REVISION: ${{ inputs.revision }}
          REUSED_RUN_ID: ${{ steps.reuse.outputs.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-candidate-evidence"
          node --input-type=module -e '
            import fs from "node:fs";
            const e = process.env;
            fs.writeFileSync(`${e.RUNNER_TEMP}/ci-candidate-evidence/evidence.json`, JSON.stringify({
              revision: e.REVISION, repository: e.GITHUB_REPOSITORY,
              run_id: e.GITHUB_RUN_ID, run_attempt: e.GITHUB_RUN_ATTEMPT,
              reused_full_run_id: e.REUSED_RUN_ID || null
            }) + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-candidate-${{ inputs.revision }}
          path: ${{ runner.temp }}/ci-candidate-evidence/evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
